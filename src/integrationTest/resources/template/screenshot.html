<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        .content {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin: 20px auto;
            max-width: 900px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .highlight {
            padding-bottom: 20px;
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }

        .answers {
            margin-top: 10px;
        }

        .answer-row {
            display: flex;
            align-items: baseline;
            padding: 8px 0;
            font-size: 16px;
            line-height: 1.5;
        }

        .answer-number {
            font-weight: bold;
            color: #555;
            min-width: 30px;
            margin-right: 10px;
        }

        .answer-text {
            color: #333;
        }
    </style>
</head>
<body>
<div class="content">{content}</div>
</body>
</html>
